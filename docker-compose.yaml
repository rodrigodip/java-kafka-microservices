services:
    postgres-db:
        image: postgres:18
        container_name: postgres_container
        shm_size: 128mb
        entrypoint: >
            sh -c "chmod +x /docker-entrypoint-initdb.d/init-wrapper.sh
            && exec /usr/local/bin/docker-entrypoint.sh postgres"
        environment:
            POSTGRES_USER_FILE: /run/secrets/db_super_user
            POSTGRES_PASSWORD_FILE: /run/secrets/db_super_password
            POSTGRES_DB_FILE: /run/secrets/db_default_name
        ports:
            - "${DB_PORT_EXTERNAL}:5432"
        volumes:
            - ./infra/data:/var/lib/postgresql
            - ./infra/init-wrapper.sh:/docker-entrypoint-initdb.d/init-wrapper.sh
        secrets:
            - db_super_user
            - db_super_password
            - db_default_name
            - products_db_user
            - products_db_password
            - products_db_name
            - clients_db_user
            - clients_db_password
            - clients_db_name
            - orders_db_user
            - orders_db_password
            - orders_db_name
        restart: unless-stopped
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U postgres"]
            interval: 10s
            timeout: 5s
            retries: 5
            start_period: 15s

    rustfs_perms:
        image: alpine
        user: root
        volumes:
            - ./infra/bucket:/fix_path
        command: sh -c "mkdir -p /fix_path/data /fix_path/logs && chown -R 10001:10001 /fix_path"

    rustfs:
        image: rustfs/rustfs:1.0.3
        depends_on:
            rustfs_perms:
                condition: service_completed_successfully
        ports:
            - "9000:9000"   # S3 API
            - "9001:9001"   # Console
        volumes:
            - ./infra/bucket/data:/data
            - ./infra/bucket/logs:/var/log/rustfs
        environment:
            RUSTFS_VOLUMES: /data
            RUSTFS_ADDRESS: ":9000"
            RUSTFS_CONSOLE_ENABLE: "true"
            RUSTFS_CONSOLE_ADDRESS: ":9001"
            RUSTFS_ACCESS_KEY_FILE: /run/secrets/s3_client_access_key
            RUSTFS_SECRET_KEY_FILE: /run/secrets/s3_client_secret_key
            RUSTFS_OBS_LOGGER_LEVEL: error
            RUSTFS_OBS_LOG_DIRECTORY: /var/log/rustfs/
        secrets:
            - s3_client_access_key
            - s3_client_secret_key
        restart: unless-stopped

    kafka:
        image: confluentinc/cp-kafka:7.9.10
        container_name: kafka-kraft
        ports:
            - "9092:9092"
        environment:
            # Configurações do nó (Broker e Controller combinados no KRaft)
            KAFKA_NODE_ID: 1
            KAFKA_PROCESS_ROLES: 'broker,controller'
            KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka:29093'
        
            # Ouvintes e Protocolos
            KAFKA_LISTENERS: 'PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:29093,EXTERNAL://0.0.0.0:19092'
            KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://localhost:9092,EXTERNAL://kafka:19092'
            KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT'
            KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
            KAFKA_INTER_BROKER_LISTENER_NAME: 'EXTERNAL'
        
            # Id do Cluster para inicialização automática do KRaft
            CLUSTER_ID: 'EyWMRQKmTHa19iiNunqj8g'
        
            # Configurações de Partições e Offset
            KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
            KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
            KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
            KAFKA_LOG_DIRS: '/var/lib/kafka/data'
        volumes:
            - kafka_data:/var/lib/kafka/data
            - ./infra/kafka/secrets:/etc/kafka/secrets

    kafka-ui:
        image: kafbat/kafka-ui:latest
        container_name: kafka-ui
        ports:
            - "8080:8080"
        environment:
            DYNAMIC_CONFIG_ENABLED: 'true'
            KAFKA_CLUSTERS_0_NAME: 'Local-KRaft-Cluster'
            KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: 'kafka:19092'
        depends_on:
            - kafka

    product-service:
        build: ./products
        image: rodrigodip/product-service:1.0.0
        container_name: product_service_app
        ports:
            - "${PRODUCTS_PORT_EXTERNAL}:8081"
        environment:
            DB_HOST: postgres-db
            DB_PORT: "5432"
        secrets:
            - products_db_user
            - products_db_password
            - products_db_name
        depends_on:
            postgres-db:
                condition: service_healthy

    client-service:
        build: ./clients
        image: rodrigodip/clients-service:1.0.0
        container_name: client_service_app
        ports:
            - "${CLIENTS_PORT_EXTERNAL}:8082"
        environment:
            DB_HOST: postgres-db
            DB_PORT: "5432"
        secrets:
            - clients_db_user
            - clients_db_password
            - clients_db_name
        depends_on:
            postgres-db:
                condition: service_healthy

    order-service:
        build: ./orders
        image: rodrigodip/orders-service:1.0.0
        container_name: order_service_app
        ports:
            - "${ORDERS_PORT_EXTERNAL}:8083"
        environment:
            DB_HOST: postgres-db
            DB_PORT: "5432"
            KAFKA_BOOTSTRAP_SERVERS: kafka:19092
            PRODUCTS_BASE_URL: ${PRODUCTS_BASE_URL:-http://product-service:8081}
            CLIENTS_BASE_URL: ${CLIENTS_BASE_URL:-http://client-service:8082}
        secrets:
            - orders_db_user
            - orders_db_password
            - orders_db_name
            - psp_callback_api_key
        depends_on:
            postgres-db:
                condition: service_healthy
            kafka:
                condition: service_started

    invoicing-service:
        build: ./invoicing
        image: rodrigodip/invoicing-service:1.0.0
        container_name: invoicing_service_app
        ports:
            - "${INVOICING_PORT_EXTERNAL}:8084"
        environment:
            S3_CLIENT_ENDPOINT: http://rustfs:9000
            S3_CLIENT_PUBLIC_ENDPOINT: ${S3_CLIENT_PUBLIC_ENDPOINT:-http://localhost:9000}
            INVOICING_PUBLIC_BASE_URL: ${INVOICING_PUBLIC_BASE_URL:-http://localhost:8084}
            KAFKA_BOOTSTRAP_SERVERS: kafka:19092
        secrets:
            - s3_client_access_key
            - s3_client_secret_key
        depends_on:
            rustfs_perms:
                condition: service_completed_successfully
            rustfs:
                condition: service_started
            kafka:
                condition: service_started

secrets:
    db_super_user:
        file: ./infra/secrets/db_super_user
    db_super_password:
        file: ./infra/secrets/db_super_password
    db_default_name:
        file: ./infra/secrets/db_default_name
    products_db_user:
        file: ./infra/secrets/products_db_user
    products_db_password:
        file: ./infra/secrets/products_db_password
    products_db_name:
        file: ./infra/secrets/products_db_name
    clients_db_user:
        file: ./infra/secrets/clients_db_user
    clients_db_password:
        file: ./infra/secrets/clients_db_password
    clients_db_name:
        file: ./infra/secrets/clients_db_name
    orders_db_user:
        file: ./infra/secrets/orders_db_user
    orders_db_password:
        file: ./infra/secrets/orders_db_password
    orders_db_name:
        file: ./infra/secrets/orders_db_name
    psp_callback_api_key:
        file: ./infra/secrets/psp_callback_api_key
    s3_client_access_key:
        file: ./infra/secrets/s3_client_access_key
    s3_client_secret_key:
        file: ./infra/secrets/s3_client_secret_key

volumes:
    kafka_data:
