spring:
    config:
        import: "optional:configtree:/run/secrets/"
    application:
        name: products
    datasource:
        url: "jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5555}/${produtos_db_name:products}"
        username: "${produtos_db_user:product_user}"
        password: "${produtos_db_password:senha_produtos_123}"
        driver-class-name: org.postgresql.Driver
    jpa:
        database-platform: org.hibernate.dialect.PostgreSQLDialect
        hibernate:
            ddl-auto: validate
        show-sql: true
        properties:
            hibernate:
                format_sql: true
    flyway:
        enabled: true
        baseline-on-migrate: true
server:
    port: 8081
