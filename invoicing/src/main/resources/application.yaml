spring:
    config:
        import: "optional:configtree:/run/secrets/"
    application:
        name: invoicing

server:
    port: 8084
    
app:
    invoicing:
        public-base-url: ${INVOICING_PUBLIC_BASE_URL:http://localhost:8084}
    s3-client:
        endpoint-url: ${S3_CLIENT_ENDPOINT:http://localhost:9000}
        public-endpoint-url: ${S3_CLIENT_PUBLIC_ENDPOINT:http://localhost:9000}
        bucket-name: order-invoice
        access-key: ${s3_client_access_key:change-me-access}
        secret-key: ${s3_client_secret_key:change-me-secret-key}
    kafka:
        server-url: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
        group-id: invoicing-service
        auto-offset-reset: earliest
        concurrency: 1
        acks: all
        retries: 3
        max-block-ms: 5s
        topics:
            paid-orders: order.paid
            invoice-generated: invoice.generated
